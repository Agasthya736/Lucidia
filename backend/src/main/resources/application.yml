spring:
  application:
    name: lucidia-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql:///${DB_NAME:lucidia}?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=${INSTANCE_CONNECTION_NAME:localhost:5433}&timezone=Asia/Kolkata}
    username: ${DB_USER:${SPRING_DATASOURCE_USERNAME:lucidia}}
    password: ${DB_PASS:${SPRING_DATASOURCE_PASSWORD:lucidia_dev_password}}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-2.5-flash

server:
  port: ${PORT:8080}
logging:
  level:
    org.springframework.security: TRACE
lucidia:
  jwt:
    # REQUIRED in production: must be at least 64 characters (512-bit).
    # In dev, set JWT_SECRET in .env or environment. Never commit a real secret here.
    secret: ${JWT_SECRET:dev-only-secret-replace-me-before-any-real-deployment-64chars!!}
    expiration-minutes: 60
  imaging:
    # Set GCS_BUCKET to activate Google Cloud Storage. Leave blank for local-disk (dev only).
    gcs-bucket: ${GCS_BUCKET:}
    storage-path: ${IMAGE_STORAGE_PATH:/data/images}
    encryption-key-ref: ${IMAGE_ENCRYPTION_KEY_REF:local-dev-only}
  auth:
    # MUST be false in production. Set lucidia.auth.allow-mock=true ONLY in local dev.
    allow-mock: ${LUCIDIA_ALLOW_MOCK:false}
  triage:
    confidence-threshold: ${TRIAGE_CONFIDENCE_THRESHOLD:0.85}
    inconclusive-threshold: ${TRIAGE_INCONCLUSIVE_THRESHOLD:0.70}
    min-lesion-area-fraction: ${TRIAGE_MIN_LESION_AREA_FRACTION:0.0005}
  edge-ai:
    triage-model-version: v0.1
  ollama:
    base-url: http://localhost:11434
    vision-model: qwen2.5vl:7b
  medsam:
    base-url: http://localhost:8001
  google:
    client-id: ${GOOGLE_CLIENT_ID:747503445476-3l387af9b2ttbeo8n0g80630dd5fo853.apps.googleusercontent.com}
