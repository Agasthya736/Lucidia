# Docker Compose profile — activated via SPRING_PROFILES_ACTIVE=docker
# All values are injected by docker-compose environment: / env_file:

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    show-sql: false

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}

lucidia:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-change-before-any-real-deployment-32chars}
    expiration-minutes: 60
  imaging:
    storage-path: ${IMAGE_STORAGE_PATH:/data/images}
    encryption-key-ref: ${IMAGE_ENCRYPTION_KEY_REF:local-dev-only}
  medsam:
    base-url: ${LUCIDIA_MEDSAM_BASE_URL:http://medsam-service:8001}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

logging:
  level:
    org.springframework.security: WARN
    root: INFO
