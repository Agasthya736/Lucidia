version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: lucidia-postgres
    environment:
      POSTGRES_DB: lucidia
      POSTGRES_USER: lucidia
      POSTGRES_PASSWORD: lucidia_dev_password
    ports:
      - "5433:5432"
    volumes:
      - lucidia_pgdata:/var/lib/postgresql/data

  medsam-service:
    build: ./medsam-service
    container_name: lucidia-medsam
    ports:
      - "8001:8001"
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  lucidia_pgdata: